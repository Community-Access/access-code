name: Bug report
description: Report something in AccessCode that is broken or hard to use
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Describe the problem. Accessibility problems are bugs, so report anything your screen reader or other assistive technology has trouble with.
      placeholder: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we make it happen ourselves?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: input
    id: accesscode-version
    attributes:
      label: AccessCode version
      description: Find it in Settings, About. For example 2.3.2-beta.6.
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Computer
      options:
        - Mac
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system version
      placeholder: For example macOS 27.3 or Windows 11 24H2
    validations:
      required: false

  - type: input
    id: assistive-technology
    attributes:
      label: Screen reader or other assistive technology
      description: Name and version, if you use one.
      placeholder: For example VoiceOver, NVDA 2026.3, JAWS 2026, Voice Control, Full Keyboard Access
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, recordings, or logs
      description: Optional. Attach files or paste what your screen reader read.
    validations:
      required: false
