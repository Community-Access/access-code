name: Feature request
description: Suggest an idea or improvement for AccessCode
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What you would like
      description: Describe the feature and how it would help you. Please search existing issues first.
    validations:
      required: true

  - type: input
    id: assistive-technology
    attributes:
      label: Screen reader or other assistive technology
      description: Optional. What you use, if it matters for this request.
    validations:
      required: false
